[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cinewatch-api"
version = "0.0.0"
description = "CineWatch TV V1 FastAPI backend service."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.128.2,<0.142",
    "pydantic-settings>=2.14.1,<2.16",
    "uvicorn>=0.48,<0.53",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest>=9.0.2,<9.2",
]
quality = [
    "mypy>=2.3.1,<2.4",
    "ruff>=0.16.6,<0.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cinewatch_api*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["cinewatch_api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
