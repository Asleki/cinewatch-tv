[project]
name = "cinewatch-api"
version = "0.0.0"
description = "CineWatch TV backend service boundary; implementation begins in CWTV.V1.2.3."
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
